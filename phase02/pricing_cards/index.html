<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/bootstrap.min.css"/>
    <link rel="stylesheet" href="css/style.css"/>
    <title>Pricing Cards</title>
</head>
<body>
      <div class="container">
        <div class="row mt-5">
            <div class="col-md-6">
               <!--Card 1-->
               <div class="card rounded-4 shadow-lg border-0 mb-5">

                    <div>
                        <h4 calss="fw-bold">Free</h4>

                    </div>
                    <h2 class="fs-1 fw-bold mt-4 mb-5">$0</h2>
                    <ul class="list-group list-group-flash fs-5 mb-5 vstack gap-2">
                        <li class="list-group item border-0">
                            <i class="bi bi-check2"></i>Single User
                        </li>
                        <li class="list-group item border-0">
                            <i class="bi bi-check2"></i>10 Downloads Per Month
                        </li>
                        <li class="list-group item border-0">
                            <i class="bi bi-check2"></i>Faster Files
                        </li>
                        <li class="list-group item border-0">
                            <i class="bi bi-check2"></i>20 Custom Packs
                        </li>
                    </ul>
                    <div class="d-grid">
                        <Button class="bt btn-dark rounded-4 mt-5 mb-4">Subscribe</Button>
                    </div>
                </div>
               </div>
            </div>
            <div class="col-md-6">

            </div>
        </div>
      </div>

    <script src="js/script.js"></script>

</html>
